name: Alchemist Gold
on:
  schedule:
    - cron: '*/5 7-10,12-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install matplotlib numpy requests
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Save cooldown
        run: |
          git config user.name "Alchemist Bot"
          git config user.email "bot@alchemist.com"
          git add last_signal.json || echo "no file"
          git diff --staged --quiet || git commit -m "cooldown [skip ci]"
          git push || echo "push fail"
