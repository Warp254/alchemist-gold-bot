name: Alchemist Gold V4.5 STRICT - Final
on:
  schedule:
    - cron: "0 7-19 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: MSNR Strict A-Grade Only
        run: |
          pip install matplotlib -q
          python3 << 'PY'
          import json, urllib.request, os, shlex, sys
          from datetime import datetime, timezone
          import matplotlib.pyplot as plt

          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT="7991886223"
          try:
              url="https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=50"
              klines=json.loads(urllib.request.urlopen(url, timeout=10).read())
              highs=[float(k[2]) for k in klines]; lows=[float(k[3]) for k in klines]; closes=[float(k[4]) for k in klines]
              live=closes[-1]
              recent_high=max(highs[-20:-2]); recent_low=min(lows[-20:-2])
              swept_high = highs[-3] > recent_high and closes[-1] < recent_high
              swept_low = lows[-3] < recent_low and closes[-1] > recent_low
              body=abs(closes[-2]-float(klines[-2][1])); range_c=highs[-2]-lows[-2] or 1
              strong_candle=body > range_c*0.6
              bos_up=closes[-1] > highs[-2] and closes[-2] > highs[-3]
              bos_down=closes[-1] < lows[-2] and closes[-2] < lows[-3]

              side=None
              if swept_low and bos_up and strong_candle:
                  side="BUY"; htf=f"Bullish Demand {recent_low:.1f}"; reason=f"Fresh Demand {recent_low:.1f} | Swept {min(lows[-5:]):.1f} | BOS Up | CRT {int(body/range_c*100)}%"
              elif swept_high and bos_down and strong_candle:
                  side="SELL"; htf=f"Bearish Supply {recent_high:.1f}"; reason=f"Fresh Supply {recent_high:.1f} | Swept {max(highs[-5:]):.1f} | BOS Down | CRT {int(body/range_c*100)}%"

              if not side:
                  print(f"No A-Grade Strict setup - Skipped. SweepH {swept_high} SweepL {swept_low} BOSup {bos_up} BOSdown {bos_down} CRT {strong_candle}")
                  sys.exit(0)

              entry_low=round(live-1,2); entry_high=round(live+1,2)
              if side=="SELL":
                  sl=round(entry_high+3.5,2); tp1=round(live-5.25,2); tp2=round(live-8.75,2); tp3=round(live-14,2)
              else:
                  sl=round(entry_low-3.5,2); tp1=round(live+5.25,2); tp2=round(live+8.75,2); tp3=round(live+14,2)
              hour=datetime.now(timezone.utc).hour
              session="London Killzone 🔥" if 7 <= hour < 12 else "NY Killzone 🔥" if 12 <= hour < 17 else "London-NY Overlap"

              fig, ax=plt.subplots(figsize=(12,7), facecolor='#0f0f0f'); ax.set_facecolor('#0f0f0f')
              ax.plot(closes[-40:],color='white',linewidth=1.6)
              ax.axhspan(entry_low, entry_high,color='yellow',alpha=0.32)
              ax.axhline(recent_high,color='orange',linestyle=':',linewidth=1.2); ax.axhline(recent_low,color='cyan',linestyle=':',linewidth=1.2)
              ax.axhline(sl,color='#ff3b3b',linestyle='--',linewidth=2.2)
              ax.axhline(tp1,color='#00ff88',linewidth=1.4); ax.axhline(tp2,color='#00ff88',linestyle='--'); ax.axhline(tp3,color='#00ff88',linestyle='--')
              plt.title(f'XAUUSD {side} | {htf} | {session} | STRICT A-Grade',color='white',fontsize=12,weight='bold',pad=18)
              ax.tick_params(colors='#666');
              for s in ax.spines.values(): s.set_color('#333')
              plt.tight_layout(); plt.savefig('/tmp/xau_chart.png',dpi=320,facecolor='#0f0f0f',bbox_inches='tight')

              caption=f"""🔔 XAUUSD {side} [V4.5 STRICT FINAL] • {session}

              💰 Live: {live:.2f} | {htf}
              📈 Sweep + BOS + CRT Confirmed

              📍 Entry: {entry_low} - {entry_high}
              🛑 SL: {sl} ($3.5) | 1% Risk
              🎯 TP1: {tp1} (1.5RR 50%) | TP2: {tp2} (2.5RR 30%) | TP3: {tp3} (4RR 20%)

              📊 Confidence: 89% Strict
              💡 {reason}

              ✅ A-Grade Only • 0-2/day • No Forced Trades
              {datetime.now().strftime('%d %b %H:%M UTC')} • Kisumu"""

              cmd=f"curl -s -X POST https://api.telegram.org/bot{TOKEN}/sendPhoto -F chat_id={CHAT} -F photo=@/tmp/xau_chart.png -F caption={shlex.quote(caption)}"
              print(os.popen(cmd).read())
          except Exception as e:
              print(f"ERROR: {e}"); sys.exit(0)
          PY
