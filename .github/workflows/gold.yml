name: Alchemist Gold
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
          
      - name: Save to docs
        run: |
          mkdir -p docs
          cp signals.json docs/signals.json 2>/dev/null || echo "no root signals"
          ls -la docs/

      - name: Commit and Push
        run: |
          git config user.name "alchemist-bot"
          git config user.email "bot@alchemist.gold"
          git add docs/
          git diff --staged --quiet || git commit -m "Gold update $(date -u)"
          git push
