name: Alchemist Gold Signal
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Send
        run: |
          python3 << 'PY'
          import json, random, urllib.request, urllib.parse

          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT_ID="7991886223"

          # 1. Get REAL live Gold price
          try:
              data = urllib.request.urlopen("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT", timeout=10).read()
              live = float(json.loads(data).get("price", "4355.41"))
          except:
              live = 4355.41

          # 2. Decide SELL / BUY (with smart bias)
          side = random.choice(["SELL","BUY","SELL","SELL"]) # more sells now - market bearish
          conf = random.randint(78,88)
          
          if side == "SELL":
              entry_low = round(live - 0.8, 2)
              entry_high = round(live + 0.8, 2)
              sl = round(entry_high + 7.0, 2)
              tp1 = round(live - 5.0, 2)
              tp2 = round(live - 12.0, 2)
              tp3 = round(live - 22.0, 2)
              reasons = [
                  "Bearish rejection + liquidity grab",
                  "Bearish BOS + supply zone",
                  "Liquidity sweep + bearish engulfing",
                  "Double top rejection + OB"
              ]
          else:
              entry_low = round(live - 0.8, 2)
              entry_high = round(live + 0.8, 2)
              sl = round(entry_low - 7.0, 2)
              tp1 = round(live + 5.0, 2)
              tp2 = round(live + 12.0, 2)
              tp3 = round(live + 22.0, 2)
              reasons = [
                  "Bullish BOS + OB demand",
                  "Bullish rejection + liquidity grab",
                  "Demand zone bounce + CHoCH",
                  "Bullish engulfing + FVG"
              ]
          
          reason = random.choice(reasons)

          # 3. EXACT FORMAT YOU WANT
          raw = f"""🔔 XAUUSD {side} SIGNAL [AUTO]

          💰 Live Price: {live}
          ⚡️ Action: {side} NOW

          📍 Entry: {entry_low} - {entry_high}
          🛑 SL: {sl}

          🎯 TP1: {tp1}
          🎯 TP2: {tp2}
          🎯 TP3: {tp3}

          📊 Confidence: {conf}%
          💡 Reason: {reason}

          Automated by Alchemist Gold Kisumu • AUTO MODE"""

          text = urllib.parse.quote(raw)
          url = f"https://api.telegram.org/bot{TOKEN}/sendMessage?chat_id={CHAT_ID}&text={text}"
          resp = urllib.request.urlopen(url, timeout=10).read()
          print(f"SENT {side} {live} - {reason}")
          print(resp.decode()[:200])
          PY
