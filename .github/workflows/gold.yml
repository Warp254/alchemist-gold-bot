name: Alchemist Gold Signal
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Send
        run: |
          python3 << 'PY'
          import json, random, urllib.request, urllib.parse
          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT_ID="7991886223"
          try:
              data = urllib.request.urlopen("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT", timeout=10).read()
              price = json.loads(data).get("price","2650")
              price = str(round(float(price),2))
          except:
              price = "2650.50"
          side = random.choice(["BUY","SELL"])
          conf = random.randint(78,89)
          raw = f"🤖 Alchemist Gold Signal\n\nGOLD {side} NOW\nPrice: ${price}\nConfidence: {conf}%\nEntry: {price}\nSL: -20\nTP: +30\n\nGood luck Warp!"
          text = urllib.parse.quote(raw)
          url = f"https://api.telegram.org/bot{TOKEN}/sendMessage?chat_id={CHAT_ID}&text={text}"
          print(f"Trying {price} {side}")
          resp = urllib.request.urlopen(url, timeout=10).read()
          print(resp.decode())
          PY
