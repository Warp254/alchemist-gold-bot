name: Alchemist Gold Signal V4
on:
  schedule:
    - cron: "0 * * * *"  # EVERY HOUR
  workflow_dispatch:
jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Send Hourly Chart Signal
        run: |
          pip install matplotlib -q
          python3 << 'PY'
          import json, random, urllib.request, urllib.parse, os
          from datetime import datetime, timezone
          import matplotlib.pyplot as plt
          import matplotlib.patches as patches
          import numpy as np

          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT_ID="7991886223"

          # 1. Live Price (with real fallback)
          try:
              data = urllib.request.urlopen("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT", timeout=10).read()
              live = float(json.loads(data).get("price","4355.41"))
          except:
              live = 4355.41 + random.uniform(-5,5)
          live = round(live,2)

          # 2. Signal Logic - FIXED RR ERROR
          side = random.choice(["BUY","SELL"])
          conf = random.randint(84,92)
          entry_low = round(live - 0.8,2)
          entry_high = round(live + 0.8,2)

          if side == "SELL":
              sl = round(entry_high + 7.5, 2)
              tp1 = round(live - 5.5, 2)
              tp2 = round(live - 13.0, 2)
              tp3 = round(live - 24.0, 2)
              htf = "Bearish (Daily Supply)"
              trend = "Downtrend - Pullback to Supply"
              reasons = ["Bearish rejection + liquidity grab @ Supply","Bearish BOS + Premium OB","Liquidity sweep + Bearish Engulfing M15"]
              color = 'red'
          else:
              sl = round(entry_low - 7.5, 2)
              tp1 = round(live + 5.5, 2)
              tp2 = round(live + 13.0, 2)
              tp3 = round(live + 24.0, 2)
              htf = "Bullish (Daily Demand)"
              trend = "Uptrend - Pullback to Demand"
              reasons = ["Bullish rejection + liquidity grab @ Demand","Bullish BOS + Discount OB + FVG","Demand bounce + CHoCH"]
              color = 'green'
          
          reason = random.choice(reasons)
          risk = round(abs(entry_high - sl) if side=="SELL" else abs(entry_low - sl),2)
          # FIXED RR - use abs
          rr1 = round(abs(tp1-live)/risk,1) if risk else 1.5
          rr2 = round(abs(tp2-live)/risk,1) if risk else 2.5
          rr3 = round(abs(tp3-live)/risk,1) if risk else 3.2

          hour = datetime.now(timezone.utc).hour
          if 7 <= hour < 11: session = "London Killzone 🔥"
          elif 12 <= hour < 16: session = "NY Killzone 🔥"
          elif 16 <= hour < 19: session = "NY Close"
          else: session = "Asian - Low Vol"

          # 3. GENERATE CHART IMAGE
          np.random.seed(random.randint(0,9999))
          prices = [live-10]
          for _ in range(100):
              prices.append(prices[-1] + random.uniform(-1.2,1.2))
          prices = np.array(prices)
          prices[-1] = live

          fig, ax = plt.subplots(figsize=(10,6), facecolor='#0f0f0f')
          ax.set_facecolor('#0f0f0f')
          ax.plot(prices, color='white', linewidth=1.2, alpha=0.9)
          
          # Entry Zone
          ax.axhspan(entry_low, entry_high, color='yellow', alpha=0.25, label='Entry Zone')
          ax.axhline(sl, color='red', linestyle='--', linewidth=1.5, label=f'SL {sl}')
          ax.axhline(tp1, color='#00ff88', linestyle='--', linewidth=1, label=f'TP1 {tp1}')
          ax.axhline(tp2, color='#00ff88', linestyle='--', linewidth=1, label=f'TP2 {tp2}')
          ax.axhline(tp3, color='#00ff88', linestyle='--', linewidth=1.2, label=f'TP3 {tp3}')
          ax.axhline(live, color='cyan', linestyle='-', linewidth=1, alpha=0.6)

          ax.text(0, entry_high+0.5, f'ENTRY {entry_low}-{entry_high}', color='yellow', fontsize=9, fontweight='bold')
          ax.text(0, sl, f'SL {sl}', color='red', fontsize=9, fontweight='bold')
          ax.text(len(prices)*0.6, tp1, f'TP1 {tp1} RR 1:{rr1}', color='#00ff88', fontsize=9)
          ax.text(len(prices)*0.6, tp3, f'TP3 {tp3} RR 1:{rr3}', color='#00ff88', fontsize=9)

          plt.title(f'XAUUSD {side} | {live} | {session}', color='white', fontsize=14, fontweight='bold')
          plt.xticks(color='gray')
          plt.yticks(color='gray')
          ax.tick_params(colors='gray')
          for spine in ax.spines.values():
              spine.set_color('#333')

          plt.tight_layout()
          plt.savefig('/tmp/xau_chart.png', dpi=150, facecolor='#0f0f0f')
          print("Chart saved")

          # 4. Caption - EXACT FORMAT V3 FIXED
          caption = f"""🔔 XAUUSD {side} SIGNAL [V4 CHART] • {session}

          💰 Live: {live} | HTF: {htf}
          ⚡️ Action: {side} NOW - M15 Entry
          📈 Context: {trend}

          📍 Entry: {entry_low} - {entry_high}
          🛑 SL: {sl} ({risk}$) | Lot: 0.02 - 0.05 (2% Risk)
          🎯 TP1: {tp1} (RR 1:{rr1}) - Close 50%
          🎯 TP2: {tp2} (RR 1:{rr2}) - Move SL to BE
          🎯 TP3: {tp3} (RR 1:{rr3}) - Runner

          📊 Confidence: {conf}% | RR Total: 1:{rr3}
          💡 Reason: {reason}

          ⏰ Session: {session}
          ⏳ Valid: 90 Minutes Only
          📌 Plan: BE at TP1, Trail at TP2
          ⚠️ News: No High Impact next 2H

          Automated by Alchemist Gold Kisumu • HOURLY MODE
          Kisumu, KE | {datetime.now().strftime('%d %b %H:%M UTC')}"""

          # 5. Send Photo with Caption via Telegram
          import subprocess, shlex
          # Use curl to send photo (most reliable)
          cmd = f"""curl -s -X POST https://api.telegram.org/bot{TOKEN}/sendPhoto -F chat_id={CHAT_ID} -F photo=@/tmp/xau_chart.png -F caption={shlex.quote(caption)}"""
          result = os.popen(cmd).read()
          print(result)
          if '"ok":true' in result or '"ok": true' in result:
              print(f"SUCCESS {side} {live}")
          else:
              # Fallback to text if photo fails
              text = urllib.parse.quote(caption)
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage?chat_id={CHAT_ID}&text={text}"
              urllib.request.urlopen(url, timeout=15).read()
              print("Fallback text sent")
          PY
