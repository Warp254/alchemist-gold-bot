name: Alchemist Gold Signal V4.1
on:
  schedule:
    - cron: "0 * * * *"  # Every hour - change to "0 7-19 * * *" for London/NY only
  workflow_dispatch:
jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Send Hourly Chart Signal
        run: |
          pip install matplotlib -q
          python3 << 'PY'
          import json, random, urllib.request, os, shlex
          from datetime import datetime, timezone
          import matplotlib.pyplot as plt
          import numpy as np

          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT_ID="7991886223"

          # 1. Live Price
          try:
              data = urllib.request.urlopen("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT", timeout=10).read()
              live = float(json.loads(data).get("price","4351.49"))
          except:
              live = 4351.49 + random.uniform(-8,8)
          live = round(live,2)

          # 2. Signal Logic - FIXED
          side = random.choice(["BUY","SELL"])
          conf = random.randint(84,92)
          entry_low = round(live - 1.0,2)
          entry_high = round(live + 1.0,2)

          if side == "SELL":
              sl = round(entry_high + 8.0, 2)
              tp1 = round(live - 8.0, 2)
              tp2 = round(live - 16.0, 2)
              tp3 = round(live - 30.0, 2)
              htf = "Bearish (Daily Supply)"
              trend = "Downtrend - Pullback to Supply"
              reasons = ["Bearish rejection + liquidity grab @ Supply","Bearish BOS + Premium OB","Liquidity sweep + Bearish Engulfing M15"]
          else:
              sl = round(entry_low - 8.0, 2)
              tp1 = round(live + 8.0, 2)
              tp2 = round(live + 16.0, 2)
              tp3 = round(live + 30.0, 2)
              htf = "Bullish (Daily Demand)"
              trend = "Uptrend - Pullback to Demand"
              reasons = ["Bullish rejection + liquidity grab @ Demand","Bullish BOS + Discount OB + FVG","Demand bounce + CHoCH"]
          
          reason = random.choice(reasons)
          risk = round(abs(entry_high - sl) if side=="SELL" else abs(entry_low - sl),2)
          rr1 = round(abs(tp1-live)/risk,1) if risk else 1.0
          rr2 = round(abs(tp2-live)/risk,1) if risk else 2.0
          rr3 = round(abs(tp3-live)/risk,1) if risk else 3.7

          hour = datetime.now(timezone.utc).hour
          if 7 <= hour < 11: session = "London Killzone 🔥"
          elif 12 <= hour < 16: session = "NY Killzone 🔥"
          elif 16 <= hour < 19: session = "NY Close"
          else: session = "Asian - Low Vol"

          # 3. HD CHART
          np.random.seed(random.randint(0,9999))
          prices = [live-12]
          for _ in range(120):
              prices.append(prices[-1] + random.uniform(-1.0,1.0))
          prices = np.array(prices)
          prices[-1] = live

          fig, ax = plt.subplots(figsize=(12,7), facecolor='#0f0f0f')
          ax.set_facecolor('#0f0f0f')
          ax.plot(prices, color='white', linewidth=1.5, alpha=0.95)
          ax.axhspan(entry_low, entry_high, color='yellow', alpha=0.3)
          ax.axhline(sl, color='#ff3b3b', linestyle='--', linewidth=2)
          ax.axhline(tp1, color='#00ff88', linestyle='-', linewidth=1.5)
          ax.axhline(tp2, color='#00ff88', linestyle='--', linewidth=1)
          ax.axhline(tp3, color='#00ff88', linestyle='--', linewidth=1)
          ax.axhline(live, color='cyan', linewidth=1)

          ax.text(2, entry_high+0.8, f'ENTRY {entry_low}-{entry_high}', color='yellow', fontsize=11, fontweight='bold', bbox=dict(facecolor='black', alpha=0.7))
          ax.text(2, sl+0.8, f'SL {sl} (-{risk}$)', color='#ff3b3b', fontsize=11, fontweight='bold', bbox=dict(facecolor='black', alpha=0.7))
          ax.text(70, tp1, f'TP1 {tp1} (1:{rr1})', color='#00ff88', fontsize=11, fontweight='bold')
          ax.text(70, tp2, f'TP2 {tp2} (1:{rr2})', color='#00ff88', fontsize=10)
          ax.text(70, tp3, f'TP3 {tp3} (1:{rr3})', color='#00ff88', fontsize=11, fontweight='bold')

          plt.title(f'XAUUSD {side} | {live} | {session} | {conf}% Confidence', color='white', fontsize=16, fontweight='bold', pad=20)
          plt.xlabel('Price Action (M15)', color='gray')
          plt.ylabel('Price $', color='gray')
          ax.tick_params(colors='gray')
          for spine in ax.spines.values():
              spine.set_color('#333')
          plt.tight_layout()
          plt.savefig('/tmp/xau_chart.png', dpi=300, facecolor='#0f0f0f', bbox_inches='tight')
          print("HD Chart saved")

          # 4. Caption
          caption = f"""🔔 XAUUSD {side} SIGNAL [V4.1 HD] • {session}

          💰 Live: {live} | HTF: {htf}
          ⚡️ Action: {side} NOW - M15 Entry
          📈 Context: {trend}

          📍 Entry: {entry_low} - {entry_high}
          🛑 SL: {sl} ({risk}$) | Lot: 0.02 - 0.05 (2% Risk)
          🎯 TP1: {tp1} (RR 1:{rr1}) - Close 50%
          🎯 TP2: {tp2} (RR 1:{rr2}) - Move SL to BE
          🎯 TP3: {tp3} (RR 1:{rr3}) - Runner

          📊 Confidence: {conf}% | RR Total: 1:{rr3}
          💡 Reason: {reason}

          ⏰ Session: {session}
          ⏳ Valid: 90 Minutes Only
          📌 Plan: BE at TP1, Trail at TP2
          ⚠️ News: No High Impact next 2H

          Automated by Alchemist Gold Kisumu • HOURLY MODE
          Kisumu, KE | {datetime.now().strftime('%d %b %H:%M UTC')}"""

          cmd = f"""curl -s -X POST https://api.telegram.org/bot{TOKEN}/sendPhoto -F chat_id={CHAT_ID} -F photo=@/tmp/xau_chart.png -F caption={shlex.quote(caption)}"""
          result = os.popen(cmd).read()
          print(result)
          PY
