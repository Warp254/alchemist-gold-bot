name: Alchemist Gold
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 min

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          # Skip if CLOSED to save GitHub minutes (exit fast)
          H=$(date -u +%H)
          if [ "$H" -lt 7 ] || [ "$H" -gt 16 ]; then
            echo "Market closed $H UTC, saving mins"
            mkdir -p docs
            echo "{\"status\":\"sleeping $H UTC\"}" > docs/signals.json
            exit 0
          fi
          python main.py
      - name: Save and Push
        run: |
          git config user.name "alchemist-bot"
          git config user.email "bot@alchemist.gold"
          mkdir -p docs
          cp signals.json docs/signals.json 2>/dev/null || true
          git add docs/ signals.json 2>/dev/null || git add docs/
          git diff --staged --quiet || git commit -m "Gold V10 REAL $(date -u)"
          git pull --rebase --autostash origin main
          git push
