name: Alchemist Gold V4.5 MSNR-CRT REAL
on:
  schedule:
    - cron: "0 7-19 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: MSNR-CRT Logic
        run: |
          pip install matplotlib numpy -q
          python3 << 'PY'
          import json, urllib.request, os, shlex
          from datetime import datetime, timezone
          import matplotlib.pyplot as plt
          import numpy as np

          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT="7991886223"

          url="https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=50"
          klines=json.loads(urllib.request.urlopen(url, timeout=10).read())
          highs=[float(k[2]) for k in klines]; lows=[float(k[3]) for k in klines]; closes=[float(k[4]) for k in klines]
          live=closes[-1]

          # === MSNR ===
          recent_high=max(highs[-20:-2]); recent_low=min(lows[-20:-2])
          # Fresh? price hasn't mitigated 50% of range
          mid=(recent_high+recent_low)/2

          # === INDUCEMENT (sweep) ===
          swept_high = highs[-3] > recent_high and closes[-1] < recent_high # fakeout up
          swept_low = lows[-3] < recent_low and closes[-1] > recent_low # fakeout down

          # === CRT + BOS ===
          body=abs(closes[-2]-float(klines[-2][1])); range_c=highs[-2]-lows[-2]
          strong_candle=body > range_c*0.6 # big body = CRT
          bos_up=closes[-1] > highs[-2] and closes[-2] > highs[-3]
          bos_down=closes[-1] < lows[-2] and closes[-2] < lows[-3]

          side=None
          if swept_low and bos_up and strong_candle and live < mid+5:
              side="BUY"; htf=f"Bullish MSNR Demand {recent_low:.1f}"; trend="Inducement Sweep Low + BOS Up + CRT"; reason=f"MSNR: Fresh Demand {recent_low:.1f}, Inducement swept {min(lows[-5:]):.1f}, CRT Bullish BOS"
              conf=89
          elif swept_high and bos_down and strong_candle and live > mid-5:
              side="SELL"; htf=f"Bearish MSNR Supply {recent_high:.1f}"; trend="Inducement Sweep High + BOS Down + CRT"; reason=f"MSNR: Fresh Supply {recent_high:.1f}, Inducement swept {max(highs[-5:]):.1f}, CRT Bearish BOS"
              conf=88
          else:
              print(f"No A-Grade: High {recent_high:.2f} Low {recent_low:.2f} sweptH {swept_high} sweptL {swept_low} BOSup {bos_up} BOSdown {bos_down}"); exit(0)

          entry_low=round(live-1.0,2); entry_high=round(live+1.0,2)
          if side=="SELL":
              sl=round(entry_high+3.5,2); tp1=round(live-5.25,2); tp2=round(live-8.75,2); tp3=round(live-14,2)
          else:
              sl=round(entry_low-3.5,2); tp1=round(live+5.25,2); tp2=round(live+8.75,2); tp3=round(live+14,2)
          hour=datetime.now(timezone.utc).hour
          session="London Killzone 🔥" if 7 <= hour < 12 else "NY Killzone 🔥" if 12 <= hour < 17 else "London-NY Overlap 🔥"

          # Chart
          fig, ax=plt.subplots(figsize=(12,7), facecolor='#0f0f0f'); ax.set_facecolor('#0f0f0f')
          ax.plot(closes[-40:],color='white',linewidth=1.5)
          ax.axhspan(entry_low, entry_high,color='yellow',alpha=0.3)
          ax.axhline(recent_high,color='orange',linestyle=':',linewidth=1,alpha=0.7); ax.axhline(recent_low,color='cyan',linestyle=':',linewidth=1,alpha=0.7)
          ax.axhline(sl,color='#ff3b3b',linestyle='--',linewidth=2)
          ax.axhline(tp1,color='#00ff88'); ax.axhline(tp2,color='#00ff88',linestyle='--'); ax.axhline(tp3,color='#00ff88',linestyle='--')
          plt.title(f'XAUUSD {side} | {htf} | {session}',color='white',fontsize=13,weight='bold',pad=20)
          ax.tick_params(colors='gray')
          for s in ax.spines.values(): s.set_color('#333')
          plt.tight_layout(); plt.savefig('/tmp/xau_chart.png',dpi=300,facecolor='#0f0f0f',bbox_inches='tight')

          caption=f"""🔔 XAUUSD {side} SIGNAL [V4.5 MSNR REAL] • {session}

          💰 Live: {live:.2f} | HTF: {htf}
          📈 Context: {trend}

          📍 Entry: {entry_low} - {entry_high}
          🛑 SL: {sl} ($3.5) | 1% Risk | 0.02-0.05 lot
          🎯 TP1: {tp1} (1.5 RR - 50%)
          🎯 TP2: {tp2} (2.5 RR - 30%)
          🎯 TP3: {tp3} (4.0 RR - 20% Runner)

          📊 Confidence: {conf}% (Real Price Action)
          💡 Reason: {reason}

          ✅ News Safe | Valid 90 Min | A-Grade Only
          MT5 + Telegram Same Logic | Kisumu {datetime.now().strftime('%H:%M UTC')}"""

          cmd=f"""curl -s -X POST https://api.telegram.org/bot{TOKEN}/sendPhoto -F chat_id={CHAT} -F photo=@/tmp/xau_chart.png -F caption={shlex.quote(caption)}"""
          print(os.popen(cmd).read())
          PY
