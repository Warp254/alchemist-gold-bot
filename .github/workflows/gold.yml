name: Alchemist Gold Signal V4.3 NEWS FILTER
on:
  schedule:
    - cron: "0 7-19 * * *"  # London + NY only
  workflow_dispatch:
jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Send With News Filter
        run: |
          pip install matplotlib -q
          python3 << 'PY'
          import json, random, urllib.request, os, shlex
          from datetime import datetime, timezone, timedelta
          import matplotlib.pyplot as plt
          import numpy as np

          TOKEN="8811197770:AAEoBPwAV3XnCy8H0F4Jnw9o9aj5L9lm-e0"
          CHAT_ID="7991886223"

          # === 1. NEWS FILTER - 15 MIN BEFORE/AFTER ===
          def check_high_impact_news():
              try:
                  # Fetch this week calendar
                  url = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
                  data = urllib.request.urlopen(url, timeout=10).read()
                  events = json.loads(data)
                  now = datetime.now(timezone.utc)
                  for ev in events:
                      # Only High Impact + USD
                      if ev.get('impact') != 'High' or 'USD' not in ev.get('currency',''):
                          continue
                      # Parse time: "2024-09-13T08:30:00-04:00" etc
                      try:
                          # ForexFactory time is ET, convert
                          t_str = ev.get('date','')  # format varies, try parse
                          # ff json has timestamp field
                          ts = ev.get('timestamp')
                          if not ts:
                              continue
                          ev_time = datetime.fromtimestamp(int(ts), tz=timezone.utc)
                          diff = abs((ev_time - now).total_seconds() / 60)  # minutes
                          if diff <= 15:  # 15 min before/after
                              return True, ev.get('title','High Impact News'), ev_time
                      except Exception as e:
                          continue
                  return False, None, None
              except Exception as e:
                  print(f"News check failed: {e} - allowing trade")
                  return False, None, None

          is_news, news_title, news_time = check_high_impact_news()
          if is_news:
              msg = f"""⚠️ NEWS FILTER ACTIVE ⚠️

          🔴 High Impact: {news_title}
          ⏰ Time: {news_time.strftime('%H:%M UTC')}
          🚫 No trade 15min before/after

          Alchemist Gold paused - protects your account.
          Next signal after news.

          Kisumu, KE | {datetime.now().strftime('%H:%M UTC')}"""
              text = shlex.quote(msg)
              cmd = f"""curl -s -X POST https://api.telegram.org/bot{TOKEN}/sendMessage -F chat_id={CHAT_ID} -F text={text}"""
              print(os.popen(cmd).read())
              print(f"SKIPPED - News: {news_title}")
              exit(0)

          # === 2. Live Price ===
          try:
              data = urllib.request.urlopen("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT", timeout=10).read()
              live = float(json.loads(data).get("price","4346.69"))
          except:
              live = 4346.69 + random.uniform(-5,5)
          live = round(live,2)

          # === 3. Signal ===
          side = random.choice(["BUY","SELL"])
          conf = random.randint(84,92)
          entry_low = round(live - 1.0,2)
          entry_high = round(live + 1.0,2)

          if side == "SELL":
              sl = round(entry_high + 8.0, 2)
              tp1 = round(live - 8.0, 2); tp2 = round(live - 16.0, 2); tp3 = round(live - 30.0, 2)
              htf = "Bearish (Daily Supply)"; trend = "Downtrend - Pullback to Supply"
              reasons = ["Bearish rejection + liquidity grab @ Supply","Bearish BOS + Premium OB"]
          else:
              sl = round(entry_low - 8.0, 2)
              tp1 = round(live + 8.0, 2); tp2 = round(live + 16.0, 2); tp3 = round(live + 30.0, 2)
              htf = "Bullish (Daily Demand)"; trend = "Uptrend - Pullback to Demand"
              reasons = ["Bullish rejection + liquidity grab @ Demand","Bullish BOS + Discount OB + FVG"]
          
          reason = random.choice(reasons)
          risk = round(abs(entry_high - sl) if side=="SELL" else abs(entry_low - sl),2)
          rr1 = round(abs(tp1-live)/risk,1); rr2 = round(abs(tp2-live)/risk,1); rr3 = round(abs(tp3-live)/risk,1)

          hour = datetime.now(timezone.utc).hour
          session = "London Killzone 🔥" if 7 <= hour < 12 else "NY Killzone 🔥" if 12 <= hour < 17 else "London-NY Overlap 🔥"

          # === 4. HD Chart ===
          np.random.seed(random.randint(0,9999))
          prices = [live-12]
          for _ in range(120): prices.append(prices[-1] + random.uniform(-1.0,1.0))
          prices = np.array(prices); prices[-1]=live
          fig, ax = plt.subplots(figsize=(12,7), facecolor='#0f0f0f')
          ax.set_facecolor('#0f0f0f'); ax.plot(prices, color='white', linewidth=1.5)
          ax.axhspan(entry_low, entry_high, color='yellow', alpha=0.3)
          ax.axhline(sl, color='#ff3b3b', linestyle='--', linewidth=2)
          ax.axhline(tp1, color='#00ff88', linestyle='-', linewidth=1.5)
          ax.axhline(tp2, color='#00ff88', linestyle='--'); ax.axhline(tp3, color='#00ff88', linestyle='--')
          ax.text(2, entry_high+0.8, f'ENTRY {entry_low}-{entry_high}', color='yellow', fontsize=11, fontweight='bold', bbox=dict(facecolor='black', alpha=0.7))
          ax.text(2, sl+0.8, f'SL {sl}', color='#ff3b3b', fontsize=11, fontweight='bold', bbox=dict(facecolor='black', alpha=0.7))
          ax.text(70, tp1, f'TP1 {tp1} (1:{rr1})', color='#00ff88', fontsize=11, fontweight='bold')
          ax.text(70, tp3, f'TP3 {tp3} (1:{rr3})', color='#00ff88', fontsize=11, fontweight='bold')
          plt.title(f'XAUUSD {side} | {live} | {session} | News Safe ✅', color='white', fontsize=16, fontweight='bold', pad=20)
          ax.tick_params(colors='gray')
          for spine in ax.spines.values(): spine.set_color('#333')
          plt.tight_layout()
          plt.savefig('/tmp/xau_chart.png', dpi=300, facecolor='#0f0f0f', bbox_inches='tight')

          caption = f"""🔔 XAUUSD {side} SIGNAL [V4.3 NEWS SAFE] • {session}

          💰 Live: {live} | HTF: {htf}
          ⚡️ Action: {side} NOW - M15 Entry
          📈 Context: {trend}

          📍 Entry: {entry_low} - {entry_high}
          🛑 SL: {sl} ({risk}$) | Lot: 0.02 - 0.05 (2% Risk)
          🎯 TP1: {tp1} (RR 1:{rr1}) - Close 50%
          🎯 TP2: {tp2} (RR 1:{rr2}) - Move SL to BE
          🎯 TP3: {tp3} (RR 1:{rr3}) - Runner

          📊 Confidence: {conf}% | RR Total: 1:{rr3}
          💡 Reason: {reason}

          ⏰ Session: {session}
          ✅ News Filter: No High Impact (15min safe)
          ⏳ Valid: 90 Minutes Only
          📌 Plan: BE at TP1, Trail at TP2

          Automated by Alchemist Gold Kisumu • LON/NY + NEWS FILTER
          Kisumu, KE | {datetime.now().strftime('%d %b %H:%M UTC')}"""

          cmd = f"""curl -s -X POST https://api.telegram.org/bot{TOKEN}/sendPhoto -F chat_id={CHAT_ID} -F photo=@/tmp/xau_chart.png -F caption={shlex.quote(caption)}"""
          print(os.popen(cmd).read())
          PY
